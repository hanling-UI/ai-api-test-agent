services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"          # 避开本机已占用的 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  mock:
    build: .
    command: uvicorn mock_server.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/postgres
      TARGET_BASE_URL: http://mock:9000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_FAST: ${LLM_FAST:-qwen-flash}
      LLM_SMART: ${LLM_SMART:-qwen-plus}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_started

volumes:
  pgdata:
